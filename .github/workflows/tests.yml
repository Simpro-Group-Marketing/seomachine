name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            data_sources/requirements.txt
            requirements-dev.txt
      - name: Install runtime and development dependencies (private connector)
        env:
          SIMPRO_CONNECTOR_TOKEN: ${{ secrets.SIMPRO_CONNECTOR_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SIMPRO_CONNECTOR_TOKEN" ]; then
            echo "missing SIMPRO_CONNECTOR_TOKEN"
            exit 1
          fi
          rewrite="url.https://x-access-token:${SIMPRO_CONNECTOR_TOKEN}@github.com/"
          git config --global "${rewrite}.insteadOf" "https://github.com/"
          status=0
          python -m pip install -r data_sources/requirements.txt -r requirements-dev.txt || status=$?
          git config --global --remove-section "$rewrite"
          exit $status
      - name: Lint for real bugs
        run: python -m ruff check .
      - name: Enforce declining structure limits
        run: python tools/check_python_structure.py
      - name: Enforce generated rule mirrors
        run: python tools/sync_rule_mirrors.py --check
      - name: Enforce compact architectural memory
        run: python tools/check_memory_contract.py
      - name: Run the full test suite
        run: python -m pytest -q -n 4 -p no:cacheprovider
