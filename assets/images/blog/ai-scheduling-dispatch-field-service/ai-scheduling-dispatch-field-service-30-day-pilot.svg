<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="30-day AI scheduling pilot" font-family="Urbanist, Inter, Arial, Helvetica, sans-serif">
