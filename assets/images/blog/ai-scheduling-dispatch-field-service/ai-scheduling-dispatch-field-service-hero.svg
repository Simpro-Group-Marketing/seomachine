<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="AI scheduling and dispatch optimization" font-family="Urbanist, Inter, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A2240" flood-opacity="0.15"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#D8E1E7" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#EEF3F6"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="1600" height="18" fill="#FFC600"/>
  <text x="72" y="78" fill="#0A2240" font-size="30" font-weight="800">Simpro</text>
  <text x="72" y="142" fill="#0A2240" font-size="52" font-weight="800" text-anchor="start"><tspan x="72" dy="0">AI scheduling and dispatch optimization</tspan></text>
  <text x="74" y="188" fill="#15314F" font-size="23" font-weight="500" text-anchor="start"><tspan x="74" dy="0">Branded operational diagram for field service scheduling decisions</tspan></text>

  <g filter="url(#shadow)">
    <rect x="76" y="286" width="352" height="430" rx="28" fill="#FFFFFF" stroke="none" stroke-width="0"/>
    <text x="118" y="356" fill="#0A2240" font-size="32" font-weight="800" text-anchor="start"><tspan x="118" dy="0">Dispatcher checks</tspan></text>
    <rect x="118" y="396" width="130" height="44" rx="22" fill="#01B59A" stroke="none" stroke-width="0"/><text x="183" y="425" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle"><tspan x="183" dy="0">Skills</tspan></text>
    <rect x="270" y="396" width="116" height="44" rx="22" fill="#E75C0D" stroke="none" stroke-width="0"/><text x="328" y="425" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle"><tspan x="328" dy="0">Priority</tspan></text>
    <rect x="118" y="462" width="126" height="44" rx="22" fill="#00A3D9" stroke="none" stroke-width="0"/><text x="181" y="491" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle"><tspan x="181" dy="0">Location</tspan></text>
    <rect x="264" y="462" width="120" height="44" rx="22" fill="#0A2240" stroke="none" stroke-width="0"/><text x="324" y="491" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle"><tspan x="324" dy="0">Parts</tspan></text>
    <text x="118" y="570" fill="#15314F" font-size="26" font-weight="600" text-anchor="start"><tspan x="118" dy="0">Approve valid moves,</tspan><tspan x="118" dy="40">hold customer promises,</tspan><tspan x="118" dy="40">recover manually.</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="510" y="260" width="1010" height="500" rx="30" fill="#FFFFFF" stroke="none" stroke-width="0"/>
    <rect x="510" y="260" width="1010" height="80" rx="30" fill="#0A2240" stroke="none" stroke-width="0"/>
    <text x="552" y="312" fill="#FFFFFF" font-size="29" font-weight="800" text-anchor="start"><tspan x="552" dy="0">AI-assisted schedule board</tspan></text>
    <text x="700" y="392" fill="#0A2240" font-size="24" font-weight="800" text-anchor="middle"><tspan x="700" dy="0">Mon</tspan></text><text x="920" y="392" fill="#0A2240" font-size="24" font-weight="800" text-anchor="middle"><tspan x="920" dy="0">Tue</tspan></text><text x="1140" y="392" fill="#0A2240" font-size="24" font-weight="800" text-anchor="middle"><tspan x="1140" dy="0">Wed</tspan></text><text x="1360" y="392" fill="#0A2240" font-size="24" font-weight="800" text-anchor="middle"><tspan x="1360" dy="0">Thu</tspan></text>
    <line x1="590" y1="422" x2="590" y2="705" stroke="#D8E1E7" stroke-width="2"/><line x1="810" y1="422" x2="810" y2="705" stroke="#D8E1E7" stroke-width="2"/><line x1="1030" y1="422" x2="1030" y2="705" stroke="#D8E1E7" stroke-width="2"/><line x1="1250" y1="422" x2="1250" y2="705" stroke="#D8E1E7" stroke-width="2"/>

      <rect x="560" y="438" width="190" height="76" rx="16" fill="#01B59A" stroke="none" stroke-width="0"/>
      <text x="582" y="469" fill="#FFFFFF" font-size="21" font-weight="800" text-anchor="start"><tspan x="582" dy="0">Install</tspan></text>
      <text x="582" y="497" fill="#FFFFFF" font-size="17" font-weight="600" text-anchor="start"><tspan x="582" dy="0">Matched skills</tspan></text>

      <rect x="780" y="420" width="190" height="76" rx="16" fill="#00A3D9" stroke="none" stroke-width="0"/>
      <text x="802" y="451" fill="#FFFFFF" font-size="21" font-weight="800" text-anchor="start"><tspan x="802" dy="0">Repair</tspan></text>
      <text x="802" y="479" fill="#FFFFFF" font-size="17" font-weight="600" text-anchor="start"><tspan x="802" dy="0">Near site</tspan></text>

      <rect x="1000" y="522" width="190" height="76" rx="16" fill="#E75C0D" stroke="none" stroke-width="0"/>
      <text x="1022" y="553" fill="#FFFFFF" font-size="21" font-weight="800" text-anchor="start"><tspan x="1022" dy="0">Emergency</tspan></text>
      <text x="1022" y="581" fill="#FFFFFF" font-size="17" font-weight="600" text-anchor="start"><tspan x="1022" dy="0">Review first</tspan></text>

      <rect x="1220" y="446" width="190" height="76" rx="16" fill="#0A2240" stroke="none" stroke-width="0"/>
      <text x="1242" y="477" fill="#FFFFFF" font-size="21" font-weight="800" text-anchor="start"><tspan x="1242" dy="0">Maintenance</tspan></text>
      <text x="1242" y="505" fill="#FFFFFF" font-size="17" font-weight="600" text-anchor="start"><tspan x="1242" dy="0">Fixed window</tspan></text>

      <rect x="670" y="616" width="190" height="76" rx="16" fill="#FFC600" stroke="none" stroke-width="0"/>
      <text x="692" y="647" fill="#0A2240" font-size="21" font-weight="800" text-anchor="start"><tspan x="692" dy="0">Open slot</tspan></text>
      <text x="692" y="675" fill="#0A2240" font-size="17" font-weight="600" text-anchor="start"><tspan x="692" dy="0">Candidate fill</tspan></text>

    <path d="M 1306 625 L 1408 625" stroke="#01B59A" stroke-width="6" stroke-linecap="round" fill="none"/>
<path d="M 1408 625 L 1395.386435849366 631.0743723476459 M 1408 625 L 1395.386435849366 618.9256276523541" stroke="#01B59A" stroke-width="6" stroke-linecap="round" fill="none"/>
    <text x="1180" y="677" fill="#01B59A" font-size="23" font-weight="800" text-anchor="start"><tspan x="1180" dy="0">Suggested move</tspan></text>
  </g>
</svg>